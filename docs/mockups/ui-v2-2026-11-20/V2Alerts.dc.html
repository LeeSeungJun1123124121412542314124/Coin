<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알림히스토리 개선안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#D9BE86;text-decoration:none}a:hover{color:#EBD9B3}
</style>
</helmet>
<div style="min-height: 1000px; background: #09090B; color: #F1F1F3; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside aria-label="주요 화면" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; background: #0D0D10; border-right: 1px solid #222227; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#09090B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-9"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em">투자분석기</span>
        <span style="font-size: 12px; color: #86868F">시장 · 파생 · 학습</span>
      </div>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 18px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #86868F; padding: 0 10px 6px">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: {{it.weight}}; color: {{it.fg}}; background: {{it.bg}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
              <span>{{it.name}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 16px">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: #86868F">기록 · 검증 / 알림히스토리</span>
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em">알림히스토리</h1>
        <p style="margin: 0; font-size: 14px; color: #ABABB4">최근 100건 중 <span style="font-family: 'IBM Plex Mono', monospace; color: #F1F1F3; font-weight: 600">78</span>건 · 시각 KST</p>
      </div>
      <span style="font-size: 13px; color: #86868F; font-family: 'IBM Plex Mono', monospace">최종 갱신 10:32</span>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px">
      <div role="group" aria-label="종류로 걸러 보기" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{l.pressed}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: {{l.fg}}; font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer">
            {{l.name}} <span style="font-family: 'IBM Plex Mono', monospace">{{l.count}}</span>
          </button>
        </sc-for>
      </div>
      <div role="group" aria-label="심볼" style="display: grid; grid-template-columns: repeat(3, 64px); background: #0D0D10; border: 1px solid #222227; border-radius: 10px; padding: 3px">
        <button type="button" aria-pressed="true" style="min-height: 38px; border: 0; border-radius: 8px; background: #2B2B31; color: #F1F1F3; font: inherit; font-size: 14px; font-weight: 600">전체</button>
        <button type="button" style="min-height: 38px; border: 0; border-radius: 8px; background: transparent; color: #ABABB4; font: inherit; font-size: 14px">BTC</button>
        <button type="button" style="min-height: 38px; border: 0; border-radius: 8px; background: transparent; color: #ABABB4; font: inherit; font-size: 14px">ETH</button>
      </div>
    </div>

    <section aria-labelledby="d1-title" style="background: #131316; border: 1px solid #222227; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 8px 24px rgba(0,0,0,0.35); padding: 4px 20px 8px; display: flex; flex-direction: column">
      <button type="button" aria-expanded="true" style="min-height: 52px; border: 0; background: transparent; color: #F1F1F3; font: inherit; display: flex; align-items: center; justify-content: space-between; padding: 0; cursor: pointer">
        <span id="d1-title" style="font-size: 15px; font-weight: 600"><span style="font-family: 'IBM Plex Mono', monospace">11-15</span> <span style="font-size: 13px; font-weight: 400; color: #ABABB4">· 3건</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABABB4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="color: #86868F; font-size: 12px; text-align: left; height: 36px">
              <th style="padding: 0 8px; font-weight: 500">시각</th>
              <th style="padding: 0 8px; font-weight: 500">종류</th>
              <th style="padding: 0 8px; font-weight: 500">심볼</th>
              <th style="padding: 0 8px; font-weight: 500">종목 방향</th>
              <th style="padding: 0 8px; font-weight: 500">시장 방향</th>
              <th style="padding: 0 8px; font-weight: 500; text-align: right">기술 점수</th>
              <th style="padding: 0 8px; font-weight: 500; text-align: right">종합 점수</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
              <tr style="height: 44px; border-top: 1px solid #1C1C21">
                <td style="padding: 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #ABABB4; white-space: nowrap">{{r.time}}</td>
                <td style="padding: 0 8px"><span style="font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; white-space: nowrap; background: {{r.levelBg}}; color: {{r.levelFg}}">{{r.level}}</span></td>
                <td style="padding: 0 8px; font-weight: 600; white-space: nowrap">{{r.symbol}}</td>
                <td style="padding: 0 8px; font-weight: 600; white-space: nowrap; color: {{r.obColor}}">{{r.ob}}</td>
                <td style="padding: 0 8px; font-weight: 600; white-space: nowrap; color: {{r.mkColor}}">{{r.mk}}</td>
                <td style="padding: 0 8px; text-align: right; font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{r.tech}}</td>
                <td style="padding: 0 8px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">{{r.total}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </section>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button type="button" aria-expanded="false" style="min-height: 52px; background: #131316; border: 1px solid #222227; border-radius: 14px; color: #F1F1F3; font: inherit; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 20px; cursor: pointer">
        <span style="display: flex; align-items: baseline; gap: 12px; min-width: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">{{d.date}}</span>
          <span style="font-size: 13px; color: #ABABB4">{{d.summary}}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #ABABB4; white-space: nowrap">{{d.count}}건</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABABB4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
    </sc-for>

    <button type="button" style="align-self: center; min-height: 48px; padding: 0 28px; border-radius: 12px; border: 1px solid #313138; background: #19191D; color: #F1F1F3; font: inherit; font-size: 14px; cursor: pointer">이전 기록 더 보기</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8A86B","options":["#C8A86B","#3FB6A8","#E8913A","#B58CFF"],"section":"테마"},"updown":{"editor":"enum","default":"kr","options":["kr","global"],"section":"테마"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8A86B';
    const kr = (this.props.updown ?? 'kr') === 'kr';
    const UP = kr ? '#F2606A' : '#3FCB8B';
    const DN = kr ? '#5AA9FF' : '#F2606A';
    const WARN = '#E8913A';
    const DANGER = '#FF7A5C';
    const VIOLET = '#B58CFF';
    const INFO = '#8EA2FF';
    const soft = (hex, a) => {
      const n = parseInt(hex.replace('#', ''), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const I = {
      home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      market: 'M3 3v18h18M7 15l4-4 3 3 5-6',
      liq: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
      vol: 'M5 20V10M10 20V4M15 20v-7M20 20V8',
      spf: 'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5',
      cvd: 'M4 5h16l-6 7v6l-4 2v-8z',
      whale: 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0-16 0M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
      doc: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',
      trophy: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4',
      bell: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0',
      cap: 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5',
    };
    const item = (name, icon, href, active) => ({
      name, icon: I[icon], href,
      fg: active ? accent : '#ABABB4',
      bg: active ? soft(accent, 0.12) : 'transparent',
      weight: active ? 600 : 500,
    });
    const level = (name, count, color, on) => ({
      name, count, pressed: on ? 'true' : 'false',
      fg: on ? '#09090B' : color,
      bg: on ? '#F1F1F3' : soft(color, 0.12),
      border: on ? '#F1F1F3' : soft(color, 0.3),
    });
    const dirColor = (d) => (d === '급락' || d === '하락' ? DN : d === '급등' || d === '상승' ? UP : '#ABABB4');
    const arrow = (d) => (d === '중립' ? '– ' : d === '급등' ? '▲ ' : '▼ ') + d;
    const row = (time, lv, color, symbol, ob, mk, tech, total) => ({
      time, level: lv, levelBg: soft(color, 0.14), levelFg: color, symbol,
      ob: arrow(ob), obColor: dirColor(ob), mk: arrow(mk), mkColor: dirColor(mk), tech, total,
    });
    return {
      accent,
      groups: [
        { label: '개요', items: [item('대시보드', 'home', 'V2Home.dc.html', false)] },
        { label: '시장', items: [item('시장분석', 'market', 'Market.dc.html', false), item('유동성', 'liq', 'Liquidity.dc.html', false), item('볼륨트래커', 'vol', 'Volume.dc.html', false)] },
        { label: '파생 · 온체인', items: [item('SPF', 'spf', 'Spf.dc.html', false), item('CVD 스크리너', 'cvd', 'Cvd.dc.html', false), item('고래추적', 'whale', 'Whale.dc.html', false)] },
        { label: '기록 · 검증', items: [item('리서치', 'doc', 'Research.dc.html', false), item('리더보드', 'trophy', 'Leaderboard.dc.html', false), item('알림히스토리', 'bell', 'V2Alerts.dc.html', true)] },
        { label: '학습', items: [item('학습', 'cap', 'Learning.dc.html', false)] },
      ],
      levels: [
        level('전체', 78, '#F1F1F3', true),
        level('확인 경보', 5, DANGER, false),
        level('경보', 26, WARN, false),
        level('청산 위험', 33, VIOLET, false),
        level('고래 감지', 11, accent, false),
        level('매크로', 2, INFO, false),
        level('청산 필요', 1, DANGER, false),
      ],
      rows: [
        row('10:26', '경보', WARN, 'BTC/USDT', '급락', '급락', '85.8', '63.5'),
        row('10:26', '경보', WARN, 'ETH/USDT', '급락', '급락', '97.3', '67.5'),
        row('06:26', '경보', WARN, 'ETH/USDT', '급락', '급락', '92.2', '73.9'),
      ],
      days: [
        { date: '11-09', summary: '확인 경보 1 · 경보 1', count: 2 },
        { date: '11-06', summary: '경보 3', count: 3 },
        { date: '11-05', summary: '경보 1', count: 1 },
        { date: '10-30', summary: '확인 경보 1', count: 1 },
        { date: '10-25', summary: '경보 1', count: 1 },
        { date: '10-09', summary: '고래 감지 4 · 경보 1', count: 5 },
        { date: '10-08', summary: '고래 감지 7', count: 7 },
      ],
    };
  }
}
</script>
</body>
</html>
