<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알림히스토리 개선안 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#D9BE86;text-decoration:none}a:hover{color:#EBD9B3}
</style>
</helmet>
<div style="width: 390px; height: 1360px; box-sizing: border-box; background: #09090B; color: #F1F1F3; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">알림히스토리</h1>
      <span style="font-size: 12px; color: #86868F; font-family: 'IBM Plex Mono', monospace">최종 갱신 10:32</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <span style="font-size: 13px; color: #ABABB4">최근 100건 중 <span style="font-family: 'IBM Plex Mono', monospace; color: #F1F1F3; font-weight: 600">78</span>건 · 시각 KST</span>
      <div role="group" aria-label="심볼" style="display: grid; grid-template-columns: repeat(3, 56px); background: #0D0D10; border: 1px solid #222227; border-radius: 10px; padding: 3px">
        <button type="button" aria-pressed="true" style="min-height: 38px; border: 0; border-radius: 8px; background: #2B2B31; color: #F1F1F3; font: inherit; font-size: 14px; font-weight: 600">전체</button>
        <button type="button" style="min-height: 38px; border: 0; border-radius: 8px; background: transparent; color: #ABABB4; font: inherit; font-size: 14px">BTC</button>
        <button type="button" style="min-height: 38px; border: 0; border-radius: 8px; background: transparent; color: #ABABB4; font: inherit; font-size: 14px">ETH</button>
      </div>
    </div>
    <div role="group" aria-label="종류로 걸러 보기" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{levels}}" as="l" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{l.pressed}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: {{l.fg}}; font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer">
          {{l.name}} <span style="font-family: 'IBM Plex Mono', monospace">{{l.count}}</span>
        </button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">

    <section aria-labelledby="d1-title" style="background: #131316; border: 1px solid #222227; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 8px 24px rgba(0,0,0,0.35); padding: 4px 16px 6px; display: flex; flex-direction: column">
      <button type="button" aria-expanded="true" style="min-height: 48px; border: 0; background: transparent; color: #F1F1F3; font: inherit; display: flex; align-items: center; justify-content: space-between; padding: 0; cursor: pointer">
        <span id="d1-title" style="font-size: 15px; font-weight: 600"><span style="font-family: 'IBM Plex Mono', monospace">11-15</span> <span style="font-size: 13px; font-weight: 400; color: #ABABB4">· 3건</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABABB4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="border-top: 1px solid #1C1C21; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #ABABB4">{{r.time}}</span>
              <span style="font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: {{r.levelBg}}; color: {{r.levelFg}}">{{r.level}}</span>
              <span style="font-size: 14px; font-weight: 600">{{r.symbol}}</span>
            </span>
            <span style="font-size: 13px; color: #ABABB4">호가 <span style="font-weight: 600; color: {{r.obColor}}">{{r.ob}}</span> · 시장 <span style="font-weight: 600; color: {{r.mkColor}}">{{r.mk}}</span> · 기술 <span style="font-family: 'IBM Plex Mono', monospace; color: #F1F1F3">{{r.tech}}</span></span>
          </div>
          <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <span style="font-size: 12px; color: #86868F">종합</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600">{{r.total}}</span>
          </div>
        </div>
      </sc-for>
    </section>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button type="button" aria-expanded="false" style="min-height: 52px; background: #131316; border: 1px solid #222227; border-radius: 14px; color: #F1F1F3; font: inherit; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px; cursor: pointer">
        <span style="display: flex; align-items: baseline; gap: 8px; min-width: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">{{d.date}}</span>
          <span style="font-size: 13px; color: #ABABB4">{{d.summary}}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #ABABB4">{{d.count}}건</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABABB4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
    </sc-for>

    <button type="button" style="min-height: 48px; border-radius: 12px; border: 1px solid #313138; background: #19191D; color: #F1F1F3; font: inherit; font-size: 14px; cursor: pointer">이전 기록 더 보기</button>
  </div>

  <nav aria-label="주요 화면" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #222227; background: #0D0D10; padding: 6px 4px 14px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: {{t.fg}}; font-weight: {{t.weight}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        {{t.name}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8A86B","options":["#C8A86B","#3FB6A8","#E3B341","#B58CFF"],"section":"테마"},"updown":{"editor":"enum","default":"kr","options":["kr","global"],"section":"테마"},"$preview":{"width":390,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8A86B';
    const kr = (this.props.updown ?? 'kr') === 'kr';
    const UP = kr ? '#F2606A' : '#3FCB8B';
    const DN = kr ? '#5AA9FF' : '#F2606A';
    const WARN = '#E8913A';
    const DANGER = '#FF7A5C';
    const VIOLET = '#B58CFF';
    const INFO = '#8EA2FF';
    const soft = (hex, a) => {
      const n = parseInt(hex.replace('#', ''), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const level = (name, count, color, on) => ({
      name, count, pressed: on ? 'true' : 'false',
      fg: on ? '#09090B' : color,
      bg: on ? '#F1F1F3' : soft(color, 0.12),
      border: on ? '#F1F1F3' : soft(color, 0.3),
    });
    const dirColor = (d) => (d === '급락' || d === '하락' ? DN : d === '급등' || d === '상승' ? UP : '#ABABB4');
    const row = (time, lv, color, symbol, ob, mk, tech, total) => ({
      time, level: lv, levelBg: soft(color, 0.14), levelFg: color, symbol,
      ob: (ob === '중립' ? '– ' : ob === '급등' ? '▲ ' : '▼ ') + ob, obColor: dirColor(ob),
      mk: (mk === '중립' ? '– ' : mk === '급등' ? '▲ ' : '▼ ') + mk, mkColor: dirColor(mk),
      tech, total,
    });
    const tab = (name, icon, href, on) => ({ name, icon, href, fg: on ? accent : '#ABABB4', weight: on ? 600 : 500 });
    return {
      levels: [
        level('전체', 78, '#F1F1F3', true),
        level('확인 경보', 5, DANGER, false),
        level('경보', 26, WARN, false),
        level('청산 위험', 33, VIOLET, false),
        level('고래 감지', 11, accent, false),
        level('매크로', 2, INFO, false),
        level('청산 필요', 1, DANGER, false),
      ],
      rows: [
        row('10:26', '경보', WARN, 'BTC/USDT', '급락', '급락', '85.8', '63.5'),
        row('10:26', '경보', WARN, 'ETH/USDT', '급락', '급락', '97.3', '67.5'),
        row('06:26', '경보', WARN, 'ETH/USDT', '급락', '급락', '92.2', '73.9'),
      ],
      days: [
        { date: '11-09', summary: '확인 경보 1 · 경보 1', count: 2 },
        { date: '11-06', summary: '경보 3', count: 3 },
        { date: '11-05', summary: '경보 1', count: 1 },
        { date: '10-30', summary: '확인 경보 1', count: 1 },
        { date: '10-25', summary: '경보 1', count: 1 },
        { date: '10-09', summary: '고래 감지 4 · 경보 1', count: 5 },
        { date: '10-08', summary: '고래 감지 7', count: 7 },
      ],
      tabs: [
        tab('홈', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', 'V2HomeMobile.dc.html', false),
        tab('시장', 'M3 3v18h18M7 15l4-4 3 3 5-6', 'Market.dc.html', false),
        tab('파생', 'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5', 'Spf.dc.html', false),
        tab('학습', 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5', 'Mobile.dc.html', false),
        tab('더보기', 'M5 12h.01M12 12h.01M19 12h.01', '#', true),
      ],
    };
  }
}
</script>
</body>
</html>
