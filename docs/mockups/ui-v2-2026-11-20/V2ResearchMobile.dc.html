<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리서치 개선안 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#D9BE86;text-decoration:none}a:hover{color:#EBD9B3}
</style>
</helmet>
<div style="width: 390px; height: 2700px; box-sizing: border-box; background: #09090B; color: #F1F1F3; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">리서치</h1>
      <span style="font-size: 12px; color: #86868F; font-family: 'IBM Plex Mono', monospace">최종 갱신 10:32</span>
    </div>
    <p style="margin: 0; font-size: 14px; color: #ABABB4; line-height: 1.6">오전 <span style="font-family: 'IBM Plex Mono', monospace; color: #F1F1F3">09:57</span> 갱신 · <span style="font-family: 'IBM Plex Mono', monospace; color: #F1F1F3">10</span>개 분석 중 <span style="font-weight: 600; color: #F0A35E">경계 2</span> · <span style="font-weight: 600; color: {{dangerColor}}">위험 2</span></p>
    <div role="group" aria-label="카테고리" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="11">
        <button type="button" aria-pressed="{{c.pressed}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer">
          {{c.name}} <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">({{c.n}})</span>
        </button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{cards}}" as="a" hint-placeholder-count="10">
      <article style="background: #131316; border: 1px solid #222227; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 8px 24px rgba(0,0,0,0.35); padding: 14px 16px 4px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; gap: 6px; align-items: center">
          <span style="font-size: 12px; border: 1px solid #313138; border-radius: 6px; padding: 2px 8px; color: #ABABB4">{{a.cat}}</span>
          <span style="font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; display: flex; align-items: center; gap: 6px; background: {{a.lbg}}; color: {{a.lfg}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{a.lfg}}"></span>{{a.level}}</span>
        </div>
        <h2 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4">{{a.title}}</h2>
        <p style="margin: 0; font-size: 13px; color: #ABABB4; line-height: 1.5">{{a.summary}}</p>
        <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px">
          <span style="font-size: 12px; color: #86868F">위험도</span>
          <div aria-hidden="true" style="flex: 1; height: 6px; border-radius: 999px; background: #2B2B31"><div style="width: {{a.score}}%; height: 100%; border-radius: 999px; background: {{a.lfg}}"></div></div>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; white-space: nowrap">{{a.score}}/100</span>
        </div>
        <button type="button" aria-expanded="false" style="min-height: 44px; margin: 0 -4px; padding: 0 4px; border: 0; border-top: 1px solid #1C1C21; background: transparent; color: #D9BE86; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
          상세
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABABB4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </article>
    </sc-for>
  </div>

  <nav aria-label="주요 화면" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #222227; background: #0D0D10; padding: 6px 4px 14px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: {{t.fg}}; font-weight: {{t.weight}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        {{t.name}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8A86B","options":["#C8A86B","#3FB6A8","#E3B341","#B58CFF"],"section":"테마"},"updown":{"editor":"enum","default":"kr","options":["kr","global"],"section":"테마"},"$preview":{"width":390,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8A86B';
    const kr = (this.props.updown ?? 'kr') === 'kr';
    const DN = kr ? '#5AA9FF' : '#F2606A';
    const WARN = '#E8913A';
    const DANGER = '#FF7A5C';
    const soft = (hex, a) => {
      const n = parseInt(hex.replace('#', ''), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const cat = (name, n, on) => ({
      name, n, pressed: on ? 'true' : 'false',
      bg: on ? soft(accent, 0.14) : 'transparent', border: on ? accent : '#2B2B31', fg: on ? '#F1F1F3' : '#ABABB4',
    });
    const L = { 위험: [soft(DANGER, 0.14), DANGER, 0], 경계: [soft(WARN, 0.14), '#F0A35E', 1], 약세: [soft(DN, 0.14), DN, 2], 중립: ['#19191D', '#ABABB4', 3] };
    const card = (c, level, title, summary, score) => ({ cat: c, level, title, summary, score, lbg: L[level][0], lfg: L[level][1], rank: L[level][2] });
    const cards = [
      card('주식수급', '위험', '주식수급 76/100', '외국인+기관 20일 −20.2조 | 거래대금 0.86x', 76),
      card('매크로', '경계', '매크로 경계 — 변동성 상승', 'VIX 28.4 | DXY 103.9 | NASDAQ −2.25% | 금 3,592$', 67),
      card('시장분석', '경계', 'VIX 주의', 'VIX 28.4', 65),
      card('기타', '중립', '고래 합의: NEUTRAL', '롱 10% / 숏 0%', 50),
      card('온체인', '중립', '온체인 중립', '유입/유출 비율 0.84', 48),
      card('알트코인', '중립', '알트 순조', 'BTC 도미넌스 57.9%', 44),
      card('주식심리', '약세', '주식심리 40/100', 'F&G 25.2 | Put/Call 0.73', 40),
      card('기술적분석', '중립', '변동성 LOW', '기술점수 38/100', 38),
      card('반도체 점검', '위험', '점검 임박 시그널 5/9 감지', '[요약]', 38),
      card('파생상품', '중립', '중립 — 하락점수 0 / 반등점수 5', '3일 OI +1.3% | 누적 FR +0.0301%', 0),
    ].sort((x, y) => x.rank - y.rank || y.score - x.score);
    const tab = (name, icon, href, on) => ({ name, icon, href, fg: on ? accent : '#ABABB4', weight: on ? 600 : 500 });
    return {
      dangerColor: DANGER,
      cats: [cat('전체', 10, true), cat('매크로', 1, false), cat('온체인', 1, false), cat('파생상품', 1, false), cat('알트코인', 1, false), cat('기술적분석', 1, false), cat('시장분석', 1, false), cat('기타', 1, false), cat('반도체 점검', 1, false), cat('주식심리', 1, false), cat('주식수급', 1, false)],
      cards,
      tabs: [
        tab('홈', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', 'V2HomeMobile.dc.html', false),
        tab('시장', 'M3 3v18h18M7 15l4-4 3 3 5-6', 'Market.dc.html', false),
        tab('파생', 'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5', 'Spf.dc.html', false),
        tab('학습', 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5', 'Mobile.dc.html', false),
        tab('더보기', 'M5 12h.01M12 12h.01M19 12h.01', '#', true),
      ],
    };
  }
}
</script>
</body>
</html>
