<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>고래추적 개선안 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#D9BE86;text-decoration:none}a:hover{color:#EBD9B3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #09090B; color: #F1F1F3; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">고래추적</h1>
      <span style="font-size: 12px; color: #86868F; font-family: 'IBM Plex Mono', monospace">최종 갱신 10:32</span>
    </div>
    <div role="group" aria-label="자산" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #0D0D10; border: 1px solid #222227; border-radius: 10px; padding: 3px">
      <sc-for list="{{assetTabs}}" as="a" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{a.pressed}}" style="min-height: 38px; border: 0; border-radius: 8px; background: {{a.bg}}; color: {{a.fg}}; font: inherit; font-size: 14px; font-weight: {{a.weight}}; cursor: pointer">{{a.name}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">

    <section aria-labelledby="cons-title" style="background: #131316; border: 1px solid #222227; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 8px 24px rgba(0,0,0,0.35); padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
        <h2 id="cons-title" style="margin: 0; font-size: 14px; font-weight: 600; color: #ABABB4">고래 BTC 방향 합의</h2>
        <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #ABABB4">중립</span>
      </div>
      <div aria-hidden="true" style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #2B2B31">
        <div style="width: 10%; background: {{upColor}}"></div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px">
        <span style="color: {{upColor}}">▲ 롱 <span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">10%</span></span>
        <span style="color: {{downColor}}">▼ 숏 <span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">0%</span></span>
      </div>
      <p style="margin: 0; font-size: 13px; color: #ABABB4; line-height: 1.6">추적 중인 10개 지갑 중 1개만 BTC 롱을 들고 있습니다.</p>
    </section>

    <sc-for list="{{whales}}" as="w" hint-placeholder-count="1">
      <a href="#" style="background: #131316; border: 1px solid #222227; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 8px 24px rgba(0,0,0,0.35); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; color: #F1F1F3">
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <span style="display: flex; align-items: center; gap: 10px; min-width: 0">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: {{accent}}">{{w.rank}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 16px; font-weight: 600">{{w.name}}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #86868F; white-space: nowrap">{{w.addr}}</span>
            </span>
          </span>
          <span style="font-size: 13px; font-weight: 600; border-radius: 6px; padding: 4px 10px; white-space: nowrap; background: {{w.tagBg}}; color: {{w.tagFg}}">{{w.tag}}</span>
        </span>
        <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border-top: 1px solid #1C1C21; padding-top: 10px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #86868F">자산</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; white-space: nowrap">{{w.equity}}</span></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #86868F">30일 손익</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; white-space: nowrap; color: #ABABB4">{{w.pnl}}</span></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #86868F">30일 ROI</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; white-space: nowrap; color: #ABABB4">{{w.roi}}</span></span>
        </span>
      </a>
    </sc-for>

    <button type="button" aria-expanded="false" style="min-height: 48px; background: #131316; border: 1px solid #222227; border-radius: 14px; color: #F1F1F3; font: inherit; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px; cursor: pointer">
      <span style="display: flex; align-items: baseline; gap: 8px; min-width: 0">
        <span style="font-size: 15px; font-weight: 600">포지션 없는 지갑 9개</span>
        <span style="font-size: 13px; color: #ABABB4">자산 <span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">$0.00–$0.01</span></span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABABB4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <nav aria-label="주요 화면" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #222227; background: #0D0D10; padding: 6px 4px 14px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: {{t.fg}}; font-weight: {{t.weight}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        {{t.name}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8A86B","options":["#C8A86B","#3FB6A8","#E3B341","#B58CFF"],"section":"테마"},"updown":{"editor":"enum","default":"kr","options":["kr","global"],"section":"테마"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8A86B';
    const kr = (this.props.updown ?? 'kr') === 'kr';
    const UP = kr ? '#F2606A' : '#3FCB8B';
    const DN = kr ? '#5AA9FF' : '#F2606A';
    const soft = (hex, a) => {
      const n = parseInt(hex.replace('#', ''), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const asset = (name, on) => ({ name, pressed: on ? 'true' : 'false', bg: on ? '#2B2B31' : 'transparent', fg: on ? '#F1F1F3' : '#ABABB4', weight: on ? 600 : 400 });
    const tab = (name, icon, href, on) => ({ name, icon, href, fg: on ? accent : '#ABABB4', weight: on ? 600 : 500 });
    return {
      accent, upColor: UP, downColor: DN,
      assetTabs: [asset('코인', true), asset('한국', false), asset('미국/환율', false)],
      whales: [
        { rank: 1, name: 'James Wynn', addr: '0x5078…edb6', equity: '$32.20K', pnl: '[손익]', roi: '[ROI]', tag: '▲ BTC 롱 40x', tagBg: soft(UP, 0.14), tagFg: UP },
      ],
      tabs: [
        tab('홈', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', 'V2HomeMobile.dc.html', false),
        tab('시장', 'M3 3v18h18M7 15l4-4 3 3 5-6', 'Market.dc.html', false),
        tab('파생', 'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5', 'Spf.dc.html', true),
        tab('학습', 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5', 'Mobile.dc.html', false),
        tab('더보기', 'M5 12h.01M12 12h.01M19 12h.01', '#', false),
      ],
    };
  }
}
</script>
</body>
</html>
